version: 2
updates:
  - package-ecosystem: "npm"
    # Mirrors pnpm-workspace.yaml: "/" is the root manifest plus the shared
    # pnpm-lock.yaml, "/packages/*" covers dashboard, docs, github-action and
    # worker, and the worker's dev harness sits deeper than that glob reaches.
    #
    # This list previously started with "/pnpm-lock.yaml". `directories` matches
    # directory paths only, so that entry selected nothing, and packages/dashboard
    # was never listed at all -- which is why pdfjs-dist (2.5.207, 2020),
    # axios and quasar have never been offered an update.
    directories:
      - "/"
      - "/packages/*"
      - "/packages/worker/dev"
    schedule:
      interval: "weekly"
    groups:
      prod-deps:
        dependency-type: "production"
      dev-deps:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
