name: Changeset Check

# Disabled: this gated every PR on a changeset, but nothing consumes them any
# more. The Release & Publish workflow that ran `changeset version` was retired
# in #7, so changesets only accumulated in .changeset/ and no CHANGELOG.md was
# ever written. The changesets tooling and config are left in place, so
# restoring the pull_request trigger revives the gate if versioning comes back.
on:
  workflow_dispatch:

jobs:
  changeset:
    name: Require changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install pnpm
        run: npm install -g pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install

      - name: Check for changeset
        run: pnpm changeset status --since=origin/main
