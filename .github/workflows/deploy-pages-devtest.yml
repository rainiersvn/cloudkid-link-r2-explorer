name: Deploy Pages (devtest)

# Disabled: the devtest preview has no reachable API backend (see
# packages/dashboard/src/apiBase.js), so it only ever showed a static
# login screen. Trigger manually via workflow_dispatch if needed again.
on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Install pnpm
        run: npm install -g pnpm@11.23.0
      - name: Install dependencies
        run: pnpm install
      - name: Build dashboard for GitHub Pages
        env:
          PUBLIC_PATH: /${{ github.event.repository.name }}/
        run: pnpm build-dashboard
      - name: Add SPA fallback for GitHub Pages routing
        run: cp packages/dashboard/dist/spa/index.html packages/dashboard/dist/spa/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/dashboard/dist/spa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
