name: Release & Publish

# Disabled: this is upstream's npm release pipeline. It runs `changeset
# publish` against `r2-explorer` on npmjs.com, a package name that belongs to
# the upstream project — this fork has no rights to it and no NODE_AUTH_TOKEN,
# and it ships as a Cloudflare Worker via deploy.yml rather than as a package.
# Every run since the fork began has failed. Trigger manually via
# workflow_dispatch if it is ever needed again.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install -g pnpm@11.23.0

      - name: Install dependencies
        run: pnpm install

      - name: Check Lint
        run: pnpm lint

      - name: Build everything
        run: pnpm build

      - name: Validate package
        run: pnpm --filter r2-explorer publint

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name == "r2-explorer") | .version')
          if [ -n "$VERSION" ]; then
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --generate-notes \
              --target main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
