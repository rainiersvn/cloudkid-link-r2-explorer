packages:
#  - "template"
  - "packages/*"
  - "packages/worker/dev"

# pnpm 11 wants an explicit build decision for every dependency that ships an
# install script, and fails `pnpm install` with ERR_PNPM_IGNORED_BUILDS until
# it gets one — this is what broke Release, which was the only workflow on a
# Node version new enough to pull pnpm 11 in.
#
# None of these need to run: esbuild, biome, workerd and sharp all resolve
# their binaries through optionalDependencies, and lint, build, both unit
# suites and the Playwright run are green without them.
allowBuilds:
  '@biomejs/biome': false
  '@parcel/watcher': false
  esbuild: false
  sharp: false
  vue-demi: false
  workerd: false
