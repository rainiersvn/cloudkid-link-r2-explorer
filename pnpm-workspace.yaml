packages:
  #  - "template"
  - "packages/*"
  - "packages/worker/dev"

# pnpm 11 wants an explicit build decision for every dependency that ships an
# install script, and fails `pnpm install` with ERR_PNPM_IGNORED_BUILDS until
# it gets one — this is what broke Release, which was the only workflow on a
# Node version new enough to pull pnpm 11 in.
#
# None of these need to run: esbuild, biome, workerd and sharp all resolve
# their binaries through optionalDependencies, and lint, build, both unit
# suites and the Playwright run are green without them.
allowBuilds:
  '@biomejs/biome': false
  '@parcel/watcher': false
  esbuild: false
  sharp: false
  vue-demi: false
  workerd: false

# CI verifies every lockfile entry against a 24h minimum release age and fails
# the install with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION otherwise. Without the
# same gate here, a local `pnpm install` resolves packages published minutes ago
# and the lockfile is only rejected once it reaches CI. Keep this in step with
# whatever CI enforces.
minimumReleaseAge: 1440
