# Weekly update PRs, each gated by the Build workflow, so a bump that breaks lint, the build or a test
# does not merge. Minor and patch bumps arrive as grouped PRs; every major gets its own PR to review alone
# (a group without update-types would carry majors in with them).
#
# cooldown: CI rejects any lockfile entry newer than 24h (minimumReleaseAge in pnpm-workspace.yaml), so
# Dependabot waits three days before proposing a release.
version: 2
updates:
  - package-ecosystem: "npm"
    # Mirrors pnpm-workspace.yaml: "/" is the root manifest plus the shared
    # pnpm-lock.yaml, "/packages/*" covers dashboard, docs, github-action and
    # worker, and the worker's dev harness sits deeper than that glob reaches.
    #
    # This list previously started with "/pnpm-lock.yaml". `directories` matches
    # directory paths only, so that entry selected nothing, and packages/dashboard
    # was never listed at all -- which is why pdfjs-dist (2.5.207, 2020),
    # axios and quasar have never been offered an update.
    directories:
      - "/"
      - "/packages/*"
      - "/packages/worker/dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      prod-deps:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-deps:
        dependency-type: "development"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
