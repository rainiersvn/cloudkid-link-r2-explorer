name: Build

# Pull requests only. Deploy does not gate on this workflow -- both fired
# independently on push to main, so the post-merge run never blocked a bad
# deploy; it only retested a commit this workflow had already checked on the
# pull request. Gating the merge is where it earns its keep.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '.editorconfig'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Install pnpm
        run: npm install -g pnpm@11.23.0
      - name: Install dependencies
        run: pnpm install
      - name: Check Lint
        run: pnpm lint
      - name: Build everything
        run: pnpm build
      - name: Run Dashboard Tests
        run: cd packages/dashboard && pnpm test
      - name: Run Worker Tests
        run: cd packages/worker && pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Install pnpm
        run: npm install -g pnpm@11.23.0
      - name: Install dependencies
        run: pnpm install
      - name: Build dashboard
        run: pnpm build-dashboard
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/dashboard/test-results/
          retention-days: 7
